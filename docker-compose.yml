services:
  recruitment-agent:
    build: .
    container_name: recruitment-agent
    expose:
      - "8765"
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      JOB_DATA_PATH: data/deploy/recruitment_jobs_deploy.csv.gz
      RAG_CACHE_PATH: /tmp/rag_runtime_cache.pkl
      RAG_MAX_FEATURES: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  recruitment-frontend:
    image: nginx:1.27-alpine
    container_name: recruitment-frontend
    depends_on:
      recruitment-agent:
        condition: service_healthy
    ports:
      - "8765:80"
    volumes:
      - ./dashboard/agent:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
